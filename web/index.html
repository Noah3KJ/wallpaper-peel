<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper Peel · Wallpaper Engine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e5e7eb; --ink:#1a1d21; --sub:#6b7280;
    --accent:#2563eb; --accent-soft:#eaf0fe;
  }
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       padding-bottom:96px}
  /* ---------- 顶栏 ---------- */
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
         border-bottom:1px solid var(--line)}
  .bar{max-width:1560px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-size:17px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
  .brand-sub{font-size:11.5px;font-weight:500;color:var(--sub);letter-spacing:.5px;
             padding-left:9px;border-left:1px solid var(--line);margin-left:1px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .path{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:1;min-width:200px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;
       font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#c9ced6;background:#fafbfc}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1d4fd7;border-color:#1d4fd7}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
  .btn.ghost:hover{background:#eef0f3;color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  .filters{max-width:1560px;margin:0 auto;padding:0 28px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;
        cursor:pointer;color:var(--sub);transition:.15s}
  .chip:hover{border-color:#c9ced6;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip b{font-weight:600}
  .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  /* ---------- 网格 ---------- */
  main{max-width:1560px;margin:22px auto 0;padding:0 28px;
       display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--card);border-radius:15px;overflow:hidden;position:relative;cursor:pointer;
        border:1.5px solid transparent;box-shadow:0 1px 2px rgba(16,20,28,.05),0 10px 26px -18px rgba(16,20,28,.35);
        transition:.16s}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,20,28,.06),0 16px 32px -18px rgba(16,20,28,.4)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 12px 28px -18px rgba(37,99,235,.6)}
  .shot{position:relative;aspect-ratio:16/9;background:#e9ebef;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
  .card:hover .shot img{transform:scale(1.03)}
  .check{position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.9);
         background:rgba(20,24,32,.35);display:flex;align-items:center;justify-content:center;transition:.15s}
  .check svg{opacity:0;transition:.15s}
  .card.sel .check{background:var(--accent);border-color:var(--accent)}
  .card.sel .check svg{opacity:1}
  .badges{position:absolute;right:10px;top:10px;display:flex;gap:6px}
  .bd{font-size:10.5px;font-weight:650;letter-spacing:.3px;padding:3px 8px;border-radius:999px;
      backdrop-filter:blur(6px);background:rgba(255,255,255,.9);color:#374151}
  .bd.k4{background:rgba(220,38,38,.92);color:#fff}
  .bd.k2{background:rgba(217,119,6,.92);color:#fff}
  .bd.vid{background:rgba(17,24,39,.82);color:#fff}
  .bd.none{background:rgba(107,114,128,.9);color:#fff}
  .info{padding:13px 15px 15px}
  .info h3{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:5px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .meta .tag{background:#f1f3f5;border-radius:5px;padding:1px 6px;font-size:11px}
  .acts{display:flex;gap:8px;margin-top:11px;opacity:0;transition:.15s}
  .card:hover .acts,.card.sel .acts{opacity:1}
  .acts .btn{flex:1;padding:6px 0;font-size:12.5px;text-align:center}
  .hint{margin-top:7px;font-size:11.5px;color:#b45309}
  /* ---------- 底部导出条 ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
        backdrop-filter:blur(14px);border-top:1px solid var(--line);
        padding:13px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
        transform:translateY(110%);transition:transform .22s}
  .dock.on{transform:none}
  .dock .count{font-size:13px;font-weight:600}
  .dock .count b{color:var(--accent);font-size:15px}
  .dock input{flex:1;min-width:240px;max-width:520px;border:1px solid var(--line);border-radius:9px;
              padding:8px 12px;font-size:12.5px;color:var(--ink);background:#fff}
  .dock input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* ---------- 目录选择弹窗 ---------- */
  .mask{position:fixed;inset:0;z-index:60;background:rgba(16,20,28,.45);display:none;
        align-items:center;justify-content:center;padding:24px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:16px;width:min(660px,100%);max-height:78vh;display:flex;flex-direction:column;
         box-shadow:0 24px 60px -20px rgba(16,20,28,.6);overflow:hidden}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h2{font-size:15px;font-weight:650;flex:1}
  .modal .mbody{padding:14px 20px;overflow:auto;flex:1;min-height:260px}
  .crumb{font-size:12px;color:var(--sub);word-break:break-all;margin-bottom:10px;
         background:#f7f8fa;border-radius:8px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace}
  .dir{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px}
  .dir:hover{background:#f2f6ff}
  .dir .ico{width:15px;height:15px;flex:0 0 15px;border-radius:4px;background:#f0c14b}
  .dir .ico.up{background:#c9ced6}
  .dir .ico.drive{background:#9aa4b2}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;
             align-items:center;background:#fafbfc}
  .modal .tip{flex:1;font-size:12px;color:#15803d}
  .empty-dir{padding:26px 10px;text-align:center;color:var(--sub);font-size:13px}
  /* ---------- 提示 ---------- */
  .toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);z-index:80;
         background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
         opacity:0;pointer-events:none;transition:.22s;max-width:80vw}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.ok{background:#15803d}
  .toast.err{background:#b91c1c}
  .empty{max-width:1560px;margin:80px auto;text-align:center;color:var(--sub);font-size:13.5px;line-height:2}
  .skeleton{height:280px;border-radius:15px;background:linear-gradient(100deg,#eceef1 30%,#f6f7f9 50%,#eceef1 70%);
            background-size:220% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-120% 0}}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <div class="brand"><span class="dot"></span>Wallpaper Peel<span class="brand-sub">壁纸库</span></div>
    <div class="path" id="path">正在扫描…</div>
    <button class="btn ghost" id="btnAll">全选</button>
    <button class="btn ghost" id="btnNone">清空</button>
    <button class="btn" id="btnAddRoot">更换壁纸目录</button>
    <button class="btn" id="btnRescan">重新扫描</button>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main id="grid"></main>
<div class="empty" id="empty" style="display:none"></div>

<div class="dock" id="dock">
  <div class="count">已选 <b id="cnt">0</b> 张</div>
  <input id="outdir" spellcheck="false" placeholder="导出目录">
  <button class="btn" id="btnPickOut">浏览…</button>
  <button class="btn" id="btnOpenDir">打开</button>
  <button class="btn primary" id="btnExport">开始导出</button>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh">
      <h2 id="modalTitle">选择文件夹</h2>
      <button class="btn ghost" id="mClose">关闭</button>
    </div>
    <div class="mbody">
      <div class="crumb" id="mPath">…</div>
      <div id="mList"></div>
    </div>
    <div class="mf">
      <div class="tip" id="mTip"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mOk">使用此文件夹</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { items: [], sel: new Set(), filter: 'all', only4k: false, browse: null, browseMode: 'root', lastDir: '' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, kind = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on ' + kind;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast ' + kind; }, 2800);
}

function visibleItems() {
  return state.items.filter(it => {
    if (state.filter === 'video' && it.kind !== 'video') return false;
    if (state.filter === 'image' && it.kind !== 'image') return false;
    if (state.only4k && !(it.w >= 3800)) return false;
    return true;
  });
}

function fmtBadge(it) {
  if (it.kind === 'video') return '<span class="bd vid">视频</span>';
  if (!it.savable) return '<span class="bd none">仅预览</span>';
  if (it.w >= 3800) return '<span class="bd k4">4K</span>';
  if (it.w >= 2500) return '<span class="bd k2">2K+</span>';
  return `<span class="bd">${it.w}×${it.h}</span>`;
}

function card(it) {
  const el = document.createElement('div');
  el.className = 'card' + (state.sel.has(it.id) ? ' sel' : '');
  el.dataset.id = it.id;
  const dims = (it.w ? `${it.w}×${it.h} · ` : '') + (it.size || '');
  const tags = (it.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  el.innerHTML = `
    <div class="shot">
      <img src="/api/thumb/${it.id}" loading="lazy" alt="">
      <div class="check"><svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 6.5L4.7 9.2L10 3.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="badges">${fmtBadge(it)}</div>
    </div>
    <div class="info">
      <h3 title="${esc(it.title || it.id)}">${esc(it.title || it.id)}</h3>
      <div class="meta"><span>${dims}</span>${tags}</div>
      ${it.kind === 'image' && it.w && it.w < 1400 ? '<div class="hint">作者原图分辨率本身偏低</div>' : ''}
      <div class="acts">
        ${it.savable ? '<button class="btn" data-act="save">保存这张</button>' : ''}
      </div>
    </div>`;
  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { e.stopPropagation(); exportIds([it.id]); return; }
    toggle(it.id);
  });
  return el;
}

function render() {
  const grid = $('grid');
  const list = visibleItems();
  grid.innerHTML = '';
  list.forEach(it => grid.appendChild(card(it)));
  $('empty').style.display = list.length ? 'none' : 'block';
  if (!list.length) $('empty').textContent = '这个筛选条件下没有壁纸。';

  const chips = [
    ['all', `全部 <b>${state.items.length}</b>`],
    ['image', `静态 <b>${state.items.filter(i => i.kind === 'image').length}</b>`],
    ['video', `视频 <b>${state.items.filter(i => i.kind === 'video').length}</b>`],
  ];
  $('filters').innerHTML = chips.map(([k, label]) =>
    `<div class="chip ${state.filter === k ? 'on' : ''}" data-f="${k}">${label}</div>`).join('')
    + '<div class="sep"></div>'
    + `<div class="chip ${state.only4k ? 'on' : ''}" data-4k="1">只看 4K</div>`;
  $('filters').querySelectorAll('[data-f]').forEach(c =>
    c.onclick = () => { state.filter = c.dataset.f; render(); });
  const c4 = $('filters').querySelector('[data-4k]');
  if (c4) c4.onclick = () => { state.only4k = !state.only4k; render(); };

  syncSel();
}

function syncSel() {
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('sel', state.sel.has(c.dataset.id)));
  const n = state.sel.size;
  $('cnt').textContent = n;
  $('dock').classList.toggle('on', n > 0);
  const vis = visibleItems().filter(i => i.savable);
  const allSel = vis.length > 0 && vis.every(i => state.sel.has(i.id));
  $('btnAll').textContent = allSel ? '取消全选' : '全选';
}

function toggle(id) {
  state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id);
  syncSel();
}

async function load() {
  $('grid').innerHTML = Array.from({ length: 6 }, () => '<div class="skeleton"></div>').join('');
  const r = await fetch('/api/list').then(r => r.json());
  state.items = r.items;
  $('outdir').value = state.lastDir || r.outdir;
  const roots = (r.roots || []).join('   ·   ');
  $('path').textContent = roots || '未找到壁纸库';
  $('path').title = roots;
  render();
  if (!r.roots || !r.roots.length) {
    $('empty').style.display = 'block';
    $('empty').innerHTML = '没有自动找到壁纸库。<br>点右上角「更换壁纸目录」，选到 '
      + '<code>…\\steamapps\\workshop\\content\\431960</code> 这一层即可。';
  }
}

async function exportIds(ids) {
  const btn = $('btnExport');
  const old = btn.textContent;
  btn.textContent = '导出中…'; btn.disabled = true;
  try {
    const r = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids, dir: $('outdir').value })
    }).then(r => r.json());
    if (r.ok === r.total && r.total > 0) {
      toast(`已保存 ${r.ok} 张 → ${r.outdir}`, 'ok');
      state.lastDir = r.outdir;
    } else if (r.results.some(x => !x.ok)) {
      toast(r.results.filter(x => !x.ok).map(x => x.msg).join('；'), 'err');
    }
  } catch (e) {
    toast('导出失败: ' + e.message, 'err');
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

/* ---------------- 目录选择：优先用 Windows 原生对话框，失败退回内置浏览器 ---------------- */
async function pickNative(mode) {
  const initial = mode === 'dir' ? $('outdir').value : ($('path').title || '');
  const title = mode === 'dir' ? '选择导出目录' : '选择壁纸库目录（…\\steamapps\\workshop\\content\\431960）';
  toast('已弹出选择框，请到弹出的窗口里选…');
  let r;
  try {
    r = await fetch('/api/pickfolder', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initial: initial || '', title: title })
    }).then(x => x.json());
  } catch (e) {
    r = { ok: false, msg: e.message };
  }
  if (!r.ok) { toast(r.msg + '，改用页面内选择器', 'err'); openBrowser(mode, initial); return; }
  if (!r.path) return;                       // 用户取消
  applyPicked(mode, r.path);
}

async function applyPicked(mode, p) {
  if (mode === 'root') {
    const r = await fetch('/api/addroot', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p })
    }).then(x => x.json());
    if (!r.ok) { toast(r.msg, 'err'); return; }
    await load();
    toast(`已切换，共 ${r.count} 个壁纸`, 'ok');
  } else {
    $('outdir').value = p;
    toast('导出目录已设为 ' + p);
  }
}

/* ---------------- 备用：页面内逐层选 ---------------- */
async function browse(path) {
  const q = path ? ('?path=' + encodeURIComponent(path)) : '';
  const r = await fetch('/api/browse' + q).then(r => r.json());
  state.browse = r;
  $('mPath').textContent = r.path || '我的电脑';
  const list = $('mList');
  let html = '';
  if (r.parent) html += `<div class="dir" data-go="${esc(r.parent)}"><span class="ico up"></span>返回上一级</div>`;
  else if (r.isDriveRoot) html += `<div class="dir" data-go=""><span class="ico up"></span>返回盘符列表</div>`;
  for (const d of r.dirs) {
    html += `<div class="dir" data-go="${esc(d.path)}"><span class="ico ${d.drive ? 'drive' : ''}"></span>${esc(d.name)}</div>`;
  }
  if (!r.dirs.length) html += '<div class="empty-dir">这里没有子文件夹</div>';
  list.innerHTML = html;
  list.querySelectorAll('[data-go]').forEach(el => el.onclick = () => browse(el.dataset.go));
  $('mTip').textContent = (state.browseMode === 'root' && r.validRoot)
    ? '✓ 这个目录里有壁纸，可以直接使用' : '';
  $('mOk').disabled = state.browseMode === 'root' ? !r.validRoot : !r.path;
  $('mOk').textContent = state.browseMode === 'root' ? '使用此目录' : '使用此文件夹';
}

function openBrowser(mode, startPath) {
  state.browseMode = mode;
  $('modalTitle').textContent = (mode === 'root' ? '选择壁纸库目录' : '选择导出目录') + '（页面内浏览）';
  $('mask').classList.add('on');
  browse(startPath || '');
}

function closeBrowser() { $('mask').classList.remove('on'); }

$('mClose').onclick = closeBrowser;
$('mCancel').onclick = closeBrowser;
$('mask').onclick = e => { if (e.target === $('mask')) closeBrowser(); };
$('mOk').onclick = async () => {
  const p = state.browse && state.browse.path;
  if (!p) return;
  const mode = state.browseMode;
  closeBrowser();
  await applyPicked(mode, p);
};

/* ---------------- 按钮 ---------------- */
$('btnAll').onclick = () => {
  const vis = visibleItems().filter(i => i.savable);
  const allSel = vis.length > 0 && vis.every(i => state.sel.has(i.id));
  if (allSel) vis.forEach(i => state.sel.delete(i.id));
  else vis.forEach(i => state.sel.add(i.id));
  render();
};
$('btnNone').onclick = () => { state.sel.clear(); render(); };
$('btnRescan').onclick = async () => {
  const b = $('btnRescan'); b.disabled = true; b.textContent = '扫描中…';
  await fetch('/api/rescan', { method: 'POST' });
  await load();
  b.disabled = false; b.textContent = '重新扫描';
  toast('扫描完成', 'ok');
};
$('btnAddRoot').onclick = () => pickNative('root');
$('btnPickOut').onclick = () => pickNative('dir');
$('btnExport').onclick = () => exportIds([...state.sel]);
$('btnOpenDir').onclick = () => {
  fetch('/api/open', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: state.lastDir || $('outdir').value })
  }).then(r => r.json()).then(r => { if (!r.ok) toast(r.msg, 'err'); });
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('mask').classList.contains('on')) { closeBrowser(); return; }
    state.sel.clear(); syncSel();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'a' && !/input/i.test(e.target.tagName)) {
    e.preventDefault(); $('btnAll').click();
  }
});

load();
</script>
</body>
</html>
